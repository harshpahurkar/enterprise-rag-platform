spring:
  application:
    name: rag-platform
  # Lets `./mvnw spring-boot:run` pick up the repo's .env (same file docker compose reads).
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${POSTGRES_USER:rag}
    password: ${POSTGRES_PASSWORD:rag}
    hikari:
      # Set once per pooled connection so a search is one autocommit round trip:
      # - iterative_scan: HNSW filters after the index scan; this keeps reading until k rows pass the role filter.
      # - force_custom_plan: after 5 runs pgjdbc server-prepares the search, and a generic plan can't see the
      #   role array, guesses 1% selectivity and skips HNSW (measured 350-425 ms vs ~5 ms). Never use it.
      connection-init-sql: SET hnsw.iterative_scan = strict_order; SET plan_cache_mode = force_custom_plan
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  # Pinned so a default change can't leak internals in /error responses. Boot 4 ignores the old
  # server.error.include-* keys; these are their replacements.
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false
      include-binding-errors: never

app:
  jwt:
    # HMAC-SHA256 key, at least 32 bytes. Required: startup fails without it.
    secret: ${JWT_SECRET:}
    ttl: 1h
  rag:
    chunk-size: 1000
    chunk-overlap: 150
    top-k: 6
    search-k: 10
    min-score: 0.6
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-opus-5-5}
    effort: medium
    max-tokens: 16000
    timeout: 120s
  demo:
    password: ${DEMO_PASSWORD:demo-password}
  # Fixed windows kept in memory. Over the limit: 429 with Retry-After.
  rate-limit:
    login: # per client IP
      requests: 10
      window: 1m
    ask: # per user
      requests: 20
      window: 1h
    ask-global: # all users together: a ceiling on LLM spend (at most 2 model calls per ask)
      requests: 500
      window: 1d
    search: # per user; each search embeds the query on the app's CPU
      requests: 120
      window: 1m
    upload: # per user; each upload is parsed, split and embedded
      requests: 30
      window: 1h
