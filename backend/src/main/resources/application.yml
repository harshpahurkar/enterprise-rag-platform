spring:
  application:
    name: rag-platform
  # Lets `./mvnw spring-boot:run` pick up the repo's .env (same file docker compose reads).
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${POSTGRES_USER:rag}
    password: ${POSTGRES_PASSWORD:rag}
    hikari:
      # Set once per pooled connection so a search is one autocommit round trip:
      # - iterative_scan: HNSW filters after the index scan; this keeps reading until k rows pass the role filter.
      # - force_custom_plan: after 5 runs pgjdbc server-prepares the search, and a generic plan can't see the
      #   role array, guesses 1% selectivity and skips HNSW (measured 350-425 ms vs ~5 ms). Never use it.
      connection-init-sql: SET hnsw.iterative_scan = strict_order; SET plan_cache_mode = force_custom_plan
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

app:
  jwt:
    # HMAC-SHA256 key, at least 32 bytes. Required: startup fails without it.
    secret: ${JWT_SECRET:}
    ttl: 1h
  rag:
    chunk-size: 1000
    chunk-overlap: 150
    top-k: 6
    search-k: 10
    min-score: 0.6
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-opus-4-5}
    effort: medium
    max-tokens: 16000
    timeout: 120s
  demo:
    password: ${DEMO_PASSWORD:demo-password}
